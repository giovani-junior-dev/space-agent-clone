<html>
  <head>
    <script type="module" src="/mod/_core/spaces/dashboard-topbar-new-space.js"></script>
  </head>
  <body>
    <div x-data="spacesDashboardTopbarNewSpace()">
      <button
        type="button"
        class="space-topbar-button"
        :disabled="creating"
        :aria-label="$t('spaces:topbar.createNewSpace')"
        :title="$t('spaces:topbar.createNewSpace')"
        @click="createSpace()"
      >
        <x-icon x-text="creating ? 'hourglass_top' : 'add'"></x-icon>
        <span x-text="creating ? $t('spaces:topbar.creating') : $t('spaces:topbar.newSpace')"></span>
      </button>
    </div>
  </body>
</html>
