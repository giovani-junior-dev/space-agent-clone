<section class="admin-panel">
  <div class="admin-card admin-info-card">
    <p><x-icon>settings</x-icon> <span x-t="'admin:dashboard.infoCard'"></span></p>
  </div>
  <template x-if="$store.adminPage.userSelfInfoLoaded && !$store.adminPage.isCurrentUserAdmin">
    <div class="admin-card admin-info-card admin-info-card--warning">
      <p><x-icon>group</x-icon> <span x-html="$t('admin:dashboard.notAdminWarningHtml')"></span></p>
    </div>
  </template>

  <div class="admin-launch-grid" :aria-label="$t('admin:dashboard.toolsAriaLabel')">
    <template x-for="action in $store.adminPage.quickActions" :key="action.id">
      <button class="admin-launch-card" type="button" @click="$store.adminPage.selectTab(action.targetTab)">
        <template x-if="action.avatarPath">
          <img class="admin-launch-avatar" :src="action.avatarPath" alt="" />
        </template>
        <template x-if="!action.avatarPath">
          <x-icon x-text="action.icon"></x-icon>
        </template>
        <span x-text="action.label"></span>
      </button>
    </template>

    <button class="admin-launch-card" type="button" @click="$store.adminShell.leaveAdminArea()">
      <x-icon>exit_to_app</x-icon>
      <span x-t="'admin:shell.leaveAdminArea'">Leave admin area</span>
    </button>
  </div>
</section>
